name: Atualizar Árvore do Kernel (Corbet)

on:
  schedule:
    # Roda a cada 3 dias às 3h da manhã (UTC) = meia-noite no Brasil
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Restaurar cache existente
        id: cache-linux
        uses: actions/cache@v3
        with:
          path: linux
          key: linux-docs-tree-${{ runner.os }}-v2

      - name: Clonar árvore completa (primeira vez)
        if: steps.cache-linux.outputs.cache-hit != 'true'
        run: |
          echo "🔄 Primeira execução - clonando árvore completa do Corbet..."
          git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/docs/linux.git linux
          echo "✅ Clone completo!"

      - name: Atualizar para a versão mais recente
        if: steps.cache-linux.outputs.cache-hit == 'true'
        run: |
          echo "⚡ Cache encontrado! Atualizando com fetch leve..."
          cd linux
          git fetch origin master --depth 1
          git reset --hard FETCH_HEAD
          git clean -fdx
          echo "✅ Árvore atualizada para o commit mais recente!"

      - name: Verificar versão
        run: |
          cd linux
          echo "📌 Último commit:"
          git log -1 --oneline
          echo "📂 Tamanho da árvore:"
          du -sh .
