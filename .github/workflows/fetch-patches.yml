name: Fetch Patches and Kernel Status

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch kernel releases from kernel.org
        run: |
          curl -sf -o kernel-releases.json "https://www.kernel.org/releases.json"
          echo "Kernel releases fetched"
          cat kernel-releases.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['releases'][0]['version'])"

      - name: Fetch Atom feed and convert to JSON
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import html

          url = "https://lore.kernel.org/linux-doc/?q=pt_BR&x=A"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          resp = urllib.request.urlopen(req, timeout=30)
          data = resp.read().decode("utf-8", errors="replace")

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "thr": "http://purl.org/syndication/thread/1.0"
          }

          root = ET.fromstring(data)
          entries = []

          for entry in root.findall("atom:entry", ns):
              title_el = entry.find("atom:title", ns)
              author_el = entry.find("atom:author/atom:name", ns)
              email_el = entry.find("atom:author/atom:email", ns)
              updated_el = entry.find("atom:updated", ns)
              link_el = entry.find("atom:link", ns)
              content_el = entry.find("atom:content", ns)

              title = title_el.text if title_el is not None else ""
              author = author_el.text if author_el is not None else ""
              email = email_el.text if email_el is not None else ""
              updated = updated_el.text if updated_el is not None else ""
              link = link_el.get("href", "") if link_el is not None else ""

              content_text = ""
              if content_el is not None:
                  content_text = ET.tostring(content_el, encoding="unicode", method="text")
                  content_text = html.unescape(content_text).strip()

              entries.append({
                  "title": title,
                  "author": author,
                  "email": email,
                  "updated": updated,
                  "link": link,
                  "content": content_text
              })

          with open("patches.json", "w", encoding="utf-8") as f:
              json.dump(entries, f, ensure_ascii=False, indent=2)

          print(f"Fetched {len(entries)} entries")
          PYEOF

      - name: Fetch and translate news
        run: |
          pip install feedparser deep-translator beautifulsoup4
          python3 << 'PYEOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import html
          from deep_translator import GoogleTranslator
          import feedparser
          from bs4 import BeautifulSoup

          def clean_html(raw_html):
              soup = BeautifulSoup(raw_html, "html.parser")
              return soup.get_text()

          def translate_text(text):
              if not text:
                  return ""
              try:
                  if len(text) > 4000:
                      text = text[:4000] + "..."
                  translator = GoogleTranslator(source='auto', target='pt')
                  return translator.translate(text)
              except Exception as e:
                  print(f"Translation error: {e}")
                  return text

          FEEDS = [
              {"name": "Phoronix", "url": "https://www.phoronix.com/rss.php"},
              {"name": "LWN", "url": "https://lwn.net/headlines/newrss"},
              {"name": "Planet Kernel", "url": "https://planet.kernel.org/rss20.xml"}
          ]

          news_items = []
          for feed_info in FEEDS:
              print(f"Fetching {feed_info['name']}...")
              try:
                  d = feedparser.parse(feed_info['url'])
                  for entry in d.entries[:10]:
                      title_en = html.unescape(entry.title) if hasattr(entry, 'title') else ""
                      summary_en = ""
                      if hasattr(entry, 'summary'):
                          summary_en = entry.summary
                      elif hasattr(entry, 'description'):
                          summary_en = entry.description
                      
                      summary_en = clean_html(summary_en).strip()
                      if len(summary_en) > 300:
                          summary_en = summary_en[:297] + "..."
                      link = entry.link if hasattr(entry, 'link') else ""
                      
                      date = ""
                      if hasattr(entry, 'published'):
                          date = entry.published
                      elif hasattr(entry, 'updated'):
                          date = entry.updated

                      title_pt = translate_text(title_en)
                      summary_pt = translate_text(summary_en)

                      news_items.append({
                          "source": feed_info['name'],
                          "title_en": title_en,
                          "title_pt": title_pt,
                          "summary_en": summary_en,
                          "summary_pt": summary_pt,
                          "link": link,
                          "date": date
                      })
              except Exception as e:
                  print(f"Error: {e}")

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(news_items, f, ensure_ascii=False, indent=2)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches.json kernel-releases.json news.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update patches and kernel status"
          git push
