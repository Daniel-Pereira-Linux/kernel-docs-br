name: Bot Revisor pt_BR (Miguel)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      message_id:
        description: 'Message-ID do patch para analisar com IA'
        required: false
        default: ''
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          ref: docs-next

      - name: Descobrir Message-ID
        id: msg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            if [[ "${{ github.event.issue.title }}" == "Miguel Analisar Patch "* ]]; then
              MSG_ID="${{ github.event.issue.title }}"
              MSG_ID="${MSG_ID#Miguel Analisar Patch }"
              echo "id=$MSG_ID" >> $GITHUB_OUTPUT
              gh issue close "${{ github.event.issue.number }}" -c "🤖 O Miguel começou a análise do patch. O site será atualizado em breve."
            else
              # Se não for uma issue do Miguel, encerra o job sem erro
              echo "id=IGNORE" >> $GITHUB_OUTPUT
            fi
          else
            echo "id=${{ github.event.inputs.message_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Cancelar se ignorado
        if: steps.msg.outputs.id == 'IGNORE'
        run: exit 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y public-inbox lei
          pip install google-genai ply

      - name: Restaurar Árvore do Kernel (Cache)
        uses: actions/cache/restore@v3
        with:
          path: linux
          key: linux-docs-tree-${{ runner.os }}-v2
          restore-keys: |
            linux-docs-tree-${{ runner.os }}-

      - name: Fallback se cache falhar
        if: hashFiles('linux/.git') == ''
        run: |
          echo "Cache não encontrado. Clonando rápido para fallback..."
          git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/docs/linux.git linux

      - name: Baixar Patches do Lore (linux-doc via lei)
        run: |
          mkdir -p patches
          lei q -f mboxrd -o patches/resultados.mbx \
            -I https://lore.kernel.org/linux-doc/ \
            "s:pt_BR AND (s:PATCH OR s:patch) AND d:60.days.ago.." \
            || echo "Nenhum patch novo ou erro no lei"

      - name: Rodar o Miguel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANALISAR_MSG_ID: ${{ steps.msg.outputs.id }}
        run: python bot_revisor.py

      - name: Salvar resultados no gh-pages
        run: |
          mv reviews.json /tmp/reviews.json || echo "[]" > /tmp/reviews.json
          git config --global user.name 'Miguel Revisor IA'
          git config --global user.email 'miguel@kernel-docs-br.com'
          git fetch origin gh-pages
          git checkout gh-pages
          mv /tmp/reviews.json data_reviews.json
          git add data_reviews.json
          git commit -m "docs: 🤖 Miguel atualizou os dados dos patches pt_BR" || echo "Sem mudanças"
          git push origin gh-pages
