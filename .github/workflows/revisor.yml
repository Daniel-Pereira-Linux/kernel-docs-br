name: Bot Revisor pt_BR (Miguel)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências (b4 e Gemini)
        run: pip install b4 google-genai

      - name: Cache da Árvore do Kernel
        id: cache-linux
        uses: actions/cache@v3
        with:
          path: linux
          key: linux-docs-tree-${{ runner.os }}-v1

      - name: Baixar Árvore do Kernel (se não estiver em cache)
        if: steps.cache-linux.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/docs/linux.git linux

      - name: Preparar ambiente do Kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y perl texlive-latex-base texlive-latex-extra graphviz imagemagick
          pip install -r linux/Documentation/sphinx/requirements.txt || true
          
      - name: Atualizar Árvore do Kernel
        run: |
          cd linux
          git fetch origin master --depth 1
          git reset --hard FETCH_HEAD
          git clean -fdx

      - name: Baixar Patches do Lore (linux-doc)
        run: |
          mkdir -p patches
          b4 q "s:pt_BR AND (s:PATCH OR s:patch) AND d:30.days.ago.." -l linux-doc -o patches/ || echo "Nenhum patch novo"

      - name: Rodar a IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_revisor.py

      - name: Mudar para branch gh-pages e salvar resultados
        run: |
          mv reviews.json /tmp/reviews.json || echo "[]" > /tmp/reviews.json
          git config --global user.name 'Bot Revisor IA'
          git config --global user.email 'bot@kernel-docs-br.com'
          git fetch origin gh-pages
          git checkout gh-pages
          mv /tmp/reviews.json data_reviews.json
          git add data_reviews.json
          git commit -m "docs: 🤖 IA Atualizou as revisões gramaticais, checkpatch e sphinx" || echo "Sem mudanças"
          git push origin gh-pages
