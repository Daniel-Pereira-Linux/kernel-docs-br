name: Bot Revisor pt_BR (Miguel)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache da Árvore do Kernel
        id: cache-linux
        uses: actions/cache@v3
        with:
          path: linux
          key: linux-docs-tree-${{ runner.os }}-v1

      - name: Baixar Árvore do Kernel (se não estiver em cache)
        if: steps.cache-linux.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/docs/linux.git linux

      - name: Preparar dependências (Kernel + Public Inbox + Gemini)
        run: |
          sudo apt-get update
          sudo apt-get install -y perl texlive-latex-base texlive-latex-extra graphviz imagemagick public-inbox
          pip install -r linux/Documentation/sphinx/requirements.txt || true
          pip install google-genai
          
      - name: Atualizar Árvore do Kernel
        run: |
          cd linux
          git fetch origin master --depth 1
          git reset --hard FETCH_HEAD
          git clean -fdx

      - name: Baixar Patches do Lore (linux-doc via lei)
        run: |
          mkdir -p patches
          # Ferramenta oficial do Kernel para buscar e-mails
          lei q -f mboxrd -o patches/resultados.mbx -I https://lore.kernel.org/linux-doc/ "s:pt_BR AND (s:PATCH OR s:patch) AND d:30.days.ago.." || echo "Nenhum patch novo ou erro no lei"

      - name: Rodar a IA (Miguel)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_revisor.py

      - name: Mudar para branch gh-pages e salvar resultados
        run: |
          mv reviews.json /tmp/reviews.json || echo "[]" > /tmp/reviews.json
          git config --global user.name 'Miguel Revisor IA'
          git config --global user.email 'miguel@kernel-docs-br.com'
          git fetch origin gh-pages
          git checkout gh-pages
          mv /tmp/reviews.json data_reviews.json
          git add data_reviews.json
          git commit -m "docs: 🤖 Miguel atualizou as revisões gramaticais, checkpatch e sphinx" || echo "Sem mudanças"
          git push origin gh-pages
