name: Gerar Interface cgit Dinâmica e CI de Patches

on:
  push:
    branches:
      - docs-next
  schedule:
    - cron: '0 3 * * *'
  issues:
    types:
      - labeled
      - unlabeled
      - edited
      - closed
      - reopened
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-and-deploy:
    if: |
      github.event_name != 'issue_comment' || 
      (!contains(github.event.comment.body, 'analise o meu patch'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 📥 Clonar Repositório na Branch Correta (docs-next)
        uses: actions/checkout@v4
        with:
          ref: docs-next
          fetch-depth: 0

      - name: 🛠️ Compilar Stagit direto do Código Fonte
        run: |
          sudo apt-get update
          sudo apt-get install libgit2-dev -y
          git clone git://codemadness.org/stagit /tmp/stagit
          cd /tmp/stagit
          make
          sudo make install

      - name: 🎛️ Preparar Customizações e Tabelas de Status
        run: |
          mkdir public
          
          # 1. CSS Definitivo
          cat <<EOF > public/style.css
          body { background-color: #111111 !important; color: #cccccc !important; font-family: monospace !important; padding: 20px; margin: 0; }
          h1 { color: #ffffff !important; font-size: 22px; margin: 0; font-weight: bold; }
          .desc { color: #999999 !important; font-size: 13px; display: block; margin-top: 5px; }
          a { color: #55ff55 !important; text-decoration: none; }
          a:hover { text-decoration: underline; }
          
          .nav-links { margin: 20px 0; font-size: 14px; color: #555; font-weight: bold; background-color: #1a1a1a; padding: 12px; border-radius: 4px; }
          .nav-links a { color: #ffffff !important; margin: 0 12px; text-decoration: none; padding: 6px 10px; }
          .nav-links a:hover { background-color: #2a2a2a; border-radius: 2px; }
          .nav-links a.active { color: #ff55ff !important; font-weight: bold; background-color: #252525; border-radius: 2px; }
          
          hr { border: 0; border-top: 1px solid #333333; margin: 20px 0; }
          table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 15px; }
          th { background-color: #222222 !important; color: #aaaaaa !important; text-align: left; padding: 10px; font-weight: bold; border-bottom: 2px solid #333333; }
          td { border-bottom: 1px solid #222222 !important; padding: 10px; color: #cccccc; vertical-align: middle; }
          tr:hover td { background-color: #1a1a1a !important; }
          #header-table { width: 100%; margin-bottom: 10px; }
          #header-table td { border: none !important; padding: 0; }
          #header-table .main-td { padding-left: 15px; vertical-align: middle; }
          
          table#header, table.line-info, td.links, .line { display: none !important; }
          table[id="header"] { display: none !important; }
          #log.gitsubmenu, .links, #git-logo { display: none !important; }
          body > table:first-of-type { display: none !important; }
          EOF

          # 2. Montar cabeçalho unificado
          cat <<EOF > /tmp/global_header.html
          <table id='header-table'><tr><td><svg height='45' viewBox='0 0 32 32' width='45' xmlns='http://www.w3.org/2000/svg' fill='#fff'><path d='M16 2C12 2 9 5 9 9c0 2.1.8 4 2.2 5.4C10 16 8 19.3 8 23c0 3.3 2.7 6 6 6h4c3.3 0 6-2.7 6-6 0-3.7-2-7-3.2-8.6C22.2 13 23 11.1 23 9c0-4-3-7-7-7zm0 2c2.8 0 5 2.2 5 5s-2.2 5-5 5-5-2.2-5-5 2.2-5 5-5zm-4 12.1c1.2-.7 2.5-1.1 4-1.1s2.8.4 4 1.1C21.2 17.7 22 20.2 22 23c0 2.2-1.8 4-4 4h-4c-2.2 0-4-1.8-4-4 0-2.8.8-5.3 2-6.9z'/></svg></td><td class='main-td'><h1>index : kernel/git/docs/linux.git</h1><span class='desc'>🇧🇷 Documentação do Kernel Linux em pt_BR | Gerenciado por Daniel Pereira</span></td></tr></table>
          <div class='nav-links'><a href='log.html' id='link-log'>Histórico de Commits</a> | <a href='files.html' id='link-tree'>Árvore de Arquivos</a> | <a href='aguardando.html' id='link-aguardando'>⚠️ Aguardando Tradução</a> | <a href='andamento.html' id='link-andamento'>⏳ Sendo Traduzidos</a> | <a href='desatualizados.html' id='link-desatualizados'>🚨 Desatualizados (Upstream)</a></div><hr/>
          EOF

          REPO_URL="https://github.com/${{ github.repository }}"
          TODAY_DATE=$(date +"%d/%m/%Y")

          # 2.5 Inicialização de Infra de Labels
          gh label create "aguardando-traducao" --color "ffaa00" --force 2>/dev/null || true
          gh label create "traduzindo" --color "0055ff" --force 2>/dev/null || true
          gh label create "desatualizado" --color "ff3333" --force 2>/dev/null || true
          gh label create "atualizado" --color "22a422" --force 2>/dev/null || true

          # 3. Processar tabela Aguardando Tradução
          TABELA_AGUARDANDO=""
          while IFS= read -r linha || [ -n "$linha" ]; do
            if [ ! -z "$(echo "$linha" | xargs)" ]; then
              ARQ_LIMPO=$(echo "$linha" | xargs)
              NOME_BASE=$(basename "$ARQ_LIMPO")
              
              URL_ISSUE=$(gh issue list --search "${ARQ_LIMPO} in:title -label:atualizado" --json url,number --jq '.[0].url')
              NUM_ISSUE=$(gh issue list --search "${ARQ_LIMPO} in:title -label:atualizado" --json number --jq '.[0].number')
              
              if [ -z "$URL_ISSUE" ] || [ "$URL_ISSUE" = "null" ]; then
                TITULO_ISSUE="[Ciclo: ${TODAY_DATE}] Tradução de ${ARQ_LIMPO}"
                
                read -r -d '' CORPO_ISSUE <<'EOF' || true
          ## 📑 Guia de Tradução

          Olá! Esta é uma discussão automatizada para coordenar a tradução do arquivo upstream.
          Se você deseja assumir este arquivo, comente nesta Issue avisando o mantenedor @Daniel-Pereira-Linux!

          ---

          ### ⚙️ Passo 0: Configurando sua Identidade no Git
          ```bash
          git config --global user.name 'Seu Nome Completo'
          git config --global user.email 'seu_email@provedor.com'
          ```

          ### 🚀 Passo a Passo para Contribuir

          #### 1. Configurando o Ambiente e o Upstream
          ```bash
          git clone [https://github.com/Daniel-Pereira-Linux/kernel-docs-br.git](https://github.com/Daniel-Pereira-Linux/kernel-docs-br.git)
          cd kernel-docs-br
          git remote add upstream [https://git.kernel.org/pub/scm/linux/kernel/git/docs/linux.git](https://git.kernel.org/pub/scm/linux/kernel/git/docs/linux.git)
          git fetch upstream docs-next
          ```

          #### 2. Criando sua Branch de Trabalho
          ```bash
          git checkout -b traducao-trabalho origin/docs-next
          ```

          #### 3. Traduzindo o Arquivo
          - Mantenha tabelas e marcações Sphinx idênticos.

          #### 4. Validando Localmente
          ```bash
          make htmldocs
          ```

          #### 5. Padronização do Commit
          ```bash
          git commit -s -m "docs: pt_BR: Tradução concluída"
          ```

          ---

          ### 🧪 🤖 Sistema de Pré-Revisão Automatizada (CI/CD na Issue)
          1. Anexe o seu arquivo .patch em um comentário nesta Issue.
          2. Escreva no mesmo comentário a frase: analise o meu patch.
          3. O robô baixará o anexo, testará o estilo e o build, postando o veredito aqui.
          EOF
                
                URL_ISSUE=$(gh issue create --title "$TITULO_ISSUE" --body "$CORPO_ISSUE" --label "aguardando-traducao" || echo "${REPO_URL}/issues")
              else
                gh issue edit "$NUM_ISSUE" --add-label "aguardando-traducao" --remove-label "traduzindo,desatualizado" 2>/dev/null || true
              fi
              
              TABELA_AGUARDANDO="${TABELA_AGUARDANDO}<tr><td>⚠️ <a href='${URL_ISSUE}' target='_blank' style='color: #ffffff; font-weight: bold; text-decoration: underline;'>${ARQ_LIMPO}</a></td><td><a href='${URL_ISSUE}' target='_blank' style='background-color: #ffaa00; color: #000; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 3px; text-decoration: none;'>💬 Entrar no Chat da Issue</a></td></tr>"
            fi
          done < aguardando_traducao.txt

          # 4. Processar tabela Sendo Traduzidos
          TABELA_ANDAMENTO=""
          NOW_EPOCH=$(date +%s)
          while IFS= read -r linha || [ -n "$linha" ]; do
            if [ ! -z "$(echo "$linha" | xargs)" ]; then
              ARQUIVO=$(echo "$linha" | awk -F ' - ' '{print $1}' | xargs)
              RESPONSAVEL=$(echo "$linha" | awk -F ' - ' '{print $2}' | sed 's/Responsável://g' | xargs)
              DATA_STR=$(echo "$linha" | awk -F ' - ' '{print $3}' | sed 's/Início://g' | xargs)
              
              if [ -z "$DATA_STR" ]; then DATA_STR=$(date +%Y-%m-%d); fi
              START_EPOCH=$(date -d "$DATA_STR" +%s 2>/dev/null || date +%s)
              DAYS_PAST=$(( (NOW_EPOCH - START_EPOCH) / 86400 ))
              DAYS_LEFT=$(( 30 - DAYS_PAST ))
              
              if [ $DAYS_LEFT -gt 0 ]; then
                CRONOMETRO="<span style='background-color: #22a422; color: #fff; padding: 2px 6px; border-radius: 3px; font-weight: bold;'>⏳ Faltam ${DAYS_LEFT} dias</span>"
              else
                CRONOMETRO="<span style='background-color: #ff3333; color: #fff; padding: 2px 6px; border-radius: 3px; font-weight: bold;'>🚨 Prazo Excedido (${DAYS_LEFT#-} dias)</span>"
              fi
              
              NUM_ISSUE_ANDAMENTO=$(gh issue list --search "${ARQUIVO} in:title -label:atualizado" --json number --jq '.[0].number')
              if [ ! -z "$NUM_ISSUE_ANDAMENTO" ] && [ "$NUM_ISSUE_ANDAMENTO" != "null" ]; then
                gh issue edit "$NUM_ISSUE_ANDAMENTO" --add-label "traduzindo" --remove-label "aguardando-traducao,desatualizado" 2>/dev/null || true
              fi
              
              DATA_BR=$(date -d "$DATA_STR" +"%d/%m/%Y" 2>/dev/null || echo "$DATA_STR")
              TABELA_ANDAMENTO="${TABELA_ANDAMENTO}<tr><td>⏳ ${ARQUIVO}</td><td style='color: #ff55ff; font-weight: bold;'>${RESPONSAVEL}</td><td>${DATA_BR}</td><td>${CRONOMETRO}</td></tr>"
            fi
          done < em_traducao.txt

          # 5. LÓGICA DE DETECÇÃO UPSTREAM PROTEGIDA
          git clone --bare --branch docs-next https://git.kernel.org/pub/scm/linux/kernel/git/docs/linux.git /tmp/upstream_corbet
          cd /tmp/upstream_corbet
          FILES_UPDATED_UPSTREAM=$(git log -n 200 --name-only --pretty=format: docs-next | grep '\.rst$' | sort -u)
          TABELA_DESATUALIZADOS=""
          cd -
          
          for arq in $FILES_UPDATED_UPSTREAM; do
            if [ -f "pt_BR/${arq}" ]; then
              cd /tmp/upstream_corbet
              COMMIT_HASH=$(git log -n 1 --pretty=format:"%H" docs-next -- "${arq}")
              COMMIT_SUBJECT=$(git log -n 1 --pretty=format:"%s" docs-next -- "${arq}")
              COMMIT_DATE=$(git log -n 1 --pretty=format:"%ad" --date=short docs-next -- "${arq}")
              cd -
              
              UPSTREAM_COMMIT_URL="https://git.kernel.org/pub/scm/linux/kernel/git/docs/linux.git/commit/?h=docs-next&id=${COMMIT_HASH}"
              TITULO_REVISAO="[Ciclo: ${TODAY_DATE}] Atualizar pt_BR/${arq}"
              
              URL_REVISAO_ISSUE=$(gh issue list --search "${arq} in:title -label:atualizado" --json url,number --jq '.[0].url')
              NUM_REVISAO_ISSUE=$(gh issue list --search "${arq} in:title -label:atualizado" --json number --jq '.[0].number')
              
              if [ -z "$URL_REVISAO_ISSUE" ] || [ "$URL_REVISAO_ISSUE" = "null" ]; then
                CORPO_REVISAO="O arquivo original \`${arq}\` recebeu atualizações upstream no commit [${COMMIT_HASH:0:7}](${UPSTREAM_COMMIT_URL}). Iniciando novo ciclo de revisão técnica."
                URL_REVISAO_ISSUE=$(gh issue create --title "$TITULO_REVISAO" --body "$CORPO_REVISAO" --label "desatualizado" || echo "${REPO_URL}/issues")
              else
                gh issue edit "$NUM_REVISAO_ISSUE" --add-label "desatualizado" --remove-label "aguardando-traducao,traduzindo" 2>/dev/null || true
              fi
              
              TABELA_DESATUALIZADOS="${TABELA_DESATUALIZADOS}<tr><td>🚨 <a href='${URL_REVISAO_ISSUE}' target='_blank' style='color: #ffffff; font-weight: bold; text-decoration: underline;'>Documentation/${arq}</a></td><td><span style='color: #888; font-size: 12px;'>${COMMIT_DATE}</span></td><td><a href='${UPSTREAM_COMMIT_URL}' target='_blank' style='color: #55ff55; text-decoration: underline;'>${COMMIT_HASH:0:7} - ${COMMIT_SUBJECT:0:40}...</a></td><td><a href='${URL_REVISAO_ISSUE}' target='_blank' style='background-color: #ff55ff; color: #000; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 3px; text-decoration: none;'>💬 Painel de Debates</a></td></tr>"
            fi
          done

          if [ -z "${TABELA_DESATUALIZADOS}" ]; then
            TABELA_DESATUALIZADOS="<tr><td colspan='4' style='color: #55ff55; text-align: center; padding: 20px;'>✅ Excelente! Todos os arquivos traduzidos estão 100% em sincronia com os commits mais recentes de Corbet!</td></tr>"
          fi

          # 6. Gerar as páginas estáticas customizadas
          cat <<EOF > public/aguardando.html
          <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Arquivos Aguardando Tradução</title><link rel="stylesheet" type="text/css" href="style.css" /></head><body>
          $(cat /tmp/global_header.html | sed 's/id="link-aguardando"/id="link-aguardando" class="active"/g')
          <table><thead><tr><th style="width: 75%;">Caminho do Arquivo Upstream</th><th>Ação / Status</th></tr></thead><tbody>${TABELA_AGUARDANDO}</tbody></table>
          </body></html>
          EOF

          cat <<EOF > public/andamento.html
          <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Arquivos Sendo Traduzidos</title><link rel="stylesheet" type="text/css" href="style.css" /></head><body>
          $(cat /tmp/global_header.html | sed 's/id="link-andamento"/id="link-andamento" class="active"/g')
          <table><thead><tr><th style="width: 45%;">Arquivo em Desenvolvimento</th><th style="width: 25%;">Responsável / Autor</th><th style="width: 15%;">Data de Início</th><th>Contagem Regressiva (SLA)</th></tr></thead><tbody>${TABELA_ANDAMENTO}</tbody></table>
          </body></html>
          EOF

          cat <<EOF > public/desatualizados.html
          <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Arquivos Desatualizados Upstream</title><link rel="stylesheet" type="text/css" href="style.css" /></head><body>
          $(cat /tmp/global_header.html | sed 's/id="link-desatualizados"/id="link-desatualizados" class="active"/g')
          <table><thead><tr><th style="width: 40%;">Arquivo Traduzido</th><th style="width: 12%;">Data Upstream</th><th style="width: 33%;">Commit Modificador (Corbet)</th><th>Fórum</th></tr></thead><tbody>${TABELA_DESATUALIZADOS}</tbody></table>
          </body></html>
          EOF

      - name: 🌐 Compilar Páginas do Stagit
        run: |
          cd public
          stagit ..
          stagit-index .. > index_projetos.html

      - name: 🎛️ Mesclar Cabeçalho e Menu Global nas Páginas Nativas do Stagit
        run: |
          cd public
          for arquivo in log.html files.html refs.html; do
            if [ -f "$arquivo" ]; then
              cat /tmp/global_header.html > /tmp/saida.html
              if [ "$arquivo" = "log.html" ]; then
                sed -i 's/id="link-log"/id="link-log" class="active"/g' /tmp/saida.html
              elif [ "$arquivo" = "files.html" ]; then
                sed -i 's/id="link-tree"/id="link-tree" class="active"/g' /tmp/saida.html
              fi
              cat "$arquivo" >> /tmp/saida.html
              mv /tmp/saida.html "$arquivo"
            fi
          done

          cat <<EOF > index.html
          <!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=log.html"></head><body></body></html>
          EOF

      - name: 🚀 Deploy em Tempo Real para o GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages

  analisar-patch:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, 'analise o meu patch')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: 📥 Inicializar Workspace Base
        uses: actions/checkout@v4
        with:
          ref: docs-next

      - name: 📥 Clonar Árvore Completa do Corbet (Upstream)
        run: |
          sudo apt-get update
          sudo apt-get install git python3-sphinx python3-sphinx-rtd-theme -y
          git clone --depth 1 --branch docs-next https://git.kernel.org/pub/scm/linux/kernel/git/docs/linux.git /tmp/corbet_tree

      - name: 🗜️ Extrair Patch Diretamente do Texto do Comentário
        run: |
          mkdir -p /tmp/patches
          
          # Baixa o texto cru injetando o ID dinâmico do contexto do evento diretamente no escopo do shell
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }} --jq '.body' > /tmp/comment_raw.txt
          
          # Isola o conteúdo que está estritamente dentro das crases de diff
          sed -n '/```diff/,/```/p' /tmp/comment_raw.txt | grep -v '```' > /tmp/patches/proposta.patch

          if [ ! -s /tmp/patches/proposta.patch ]; then
            gh issue comment "$ISSUE_NUMBER" --repo ${{ github.repository }} --body "❌ **Erro do Sistema de CI:** Não encontrei nenhum bloco de código formatado com \`\`\`diff \`\`\` contendo o patch no seu comentário."
            exit 1
          fi

      - name: 🧪 Executar Validações Oficiais do Kernel (Apenas checkpatch)
        run: |
          cd /tmp/corbet_tree
          
          # Executa o checkpatch de estilo direto no arquivo .patch sem tentar aplicar as linhas via git apply
          CHECKPATCH_OUT=$(./scripts/checkpatch.pl --no-tree --patch /tmp/patches/proposta.patch || true)
          
          gh issue comment "$ISSUE_NUMBER" --repo ${{ github.repository }} --body "🤖 **[SRE CI/CD] Análise Estática Concluída!**%0A%0A📝 **Resultado do \`./scripts/checkpatch.pl\`:**%0A\`\`\`text%0A${CHECKPATCH_OUT}%0A\`\`\`%0A%0A---%0A⏳ **Status:** Avaliação de estilo concluída. Aguardando revisão manual do mantenedor @Daniel-Pereira-Linux."
