name: Gerar Interface cgit Dinâmica

on:
  push:
    branches:
      - docs-next

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositório com Histórico Completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Compilar Stagit direto do Código Fonte
        run: |
          sudo apt-get update
          sudo apt-get install libgit2-dev -y
          git clone git://codemadness.org/stagit /tmp/stagit
          cd /tmp/stagit
          make
          sudo make install

      - name: 🌐 Gerar Base do cgit com Commits Reais
        run: |
          mkdir public
          cd public
          stagit ..
          stagit-index .. > index_projetos.html

      - name: 🎛️ Customizar Interface, Injetar Identidade e Tabelas de Status
        run: |
          cd public
          
          # 1. Monta a tabela de arquivos Aguardando Tradução com link de e-mail (mailto)
          TABELA_AGUARDANDO=""
          while IFS= read -r linha || [ -n "$linha" ]; do
            if [ ! -z "$linha" ]; then
              ASSUNTO="Solicitacao de Traducao: $linha"
              CORPO="Ola Daniel,%0D%0A%0D%0AGostaria de solicitar a traducao ou me voluntariar para traduzir o arquivo: $linha.%0D%0A%0D%0AMeu Nome/E-mail para registro: "
              
              TABELA_AGUARDANDO="$TABELA_AGUARDANDO<tr><td class='commit-msg'>⚠️ <a href='mailto:daniel.pereira.eng.sre@gmail.com?subject=$ASSUNTO&body=$CORPO' style='color: #55ff55; text-decoration: underline;'>$linha</a></td><td><span class='branch-tag' style='background-color: #ff5555; color: #000; padding: 1px 4px; font-size: 11px; font-weight: bold; border-radius: 2px;'>Clique para Solicitar</span></td></tr>"
            fi
          done < ../aguardando_traducao.txt

          # 2. Monta a tabela de arquivos Sendo Traduzidos
          TABELA_ANDAMENTO=""
          while IFS= read -r linha || [ -n "$linha" ]; do
            if [ ! -z "$linha" ]; then
              ARQUIVO=$(echo "$linha" | cut -d'-' -f1 | xargs)
              RESPONSAVEL=$(echo "$linha" | cut -d'-' -f2 | xargs)
              TABELA_ANDAMENTO="$TABELA_ANDAMENTO<tr><td class='commit-msg'>⏳ $ARQUIVO</td><td class='author' style='color: #ff55ff;'>$RESPONSAVEL</td></tr>"
            fi
          done < ../em_traducao.txt

          # 3. Cria a página estilizada: Aguardando Tradução
          cat <<EOF > aguardando.html
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8"><title>Arquivos Aguardando Tradução</title>
          <link rel="stylesheet" type="text/css" href="style.css" />
          </head>
          <body>
          <table id="header"><tr>
          <td><svg height="40" viewBox="0 0 32 32" width="40" xmlns="http://www.w3.org/2000/svg" fill="#fff"><path d="M16 2C12 2 9 5 9 9c0 2.1.8 4 2.2 5.4C10 16 8 19.3 8 23c0 3.3 2.7 6 6 6h4c3.3 0 6-2.7 6-6 0-3.7-2-7-3.2-8.6C22.2 13 23 11.1 23 9c0-4-3-7-7-7zm0 2c2.8 0 5 2.2 5 5s-2.2 5-5 5-5-2.2-5-5 2.2-5 5-5zm-4 12.1c1.2-.7 2.5-1.1 4-1.1s2.8.4 4 1.1C21.
